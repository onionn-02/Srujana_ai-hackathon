    </button>

  <button class="btn float-menu" type="button" data-menu-toggle aria-controls="rail" aria-expanded="false">
    <svg class="icon i-open" aria-hidden="true"><use href="#i-menu"/></svg><svg class="icon i-shut" aria-hidden="true"><use href="#i-close"/></svg>Screens
  </button>

  <aside class="rail" id="rail" aria-label="App menu">

<template id="tpl-style">
  <header class="screen-head">
    <div>
      <h1 tabindex="-1">Style guide</h1>
      <p class="lede">The colours, type and parts every screen is built from. All patient details are fictional, and nothing on this page is saved.</p>
    </div>
    <div class="segmented" role="group" aria-label="Colour theme">
      <button type="button" data-theme-choice="system" aria-pressed="true">Match device</button>
      <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <section class="sg" aria-labelledby="sg-band">
    <h2 id="sg-band">Patient band</h2>
    <p class="sg-note">Sits at the top of every case screen, like the patient's wristband. Allergy status always shows one of three states, so an empty space never hides a missing check.</p>
    <div class="stack">
      <div class="band">
        <div class="band-id">
          <span class="band-name">Ravi Kumar</span>
          <dl class="band-facts">
            <div><dt>Age</dt><dd>64</dd></div>
            <div><dt>Sex</dt><dd>Male</dd></div>
            <div><dt>Demo ID</dt><dd class="data">1001</dd></div>
          </dl>
          <span class="band-proc"><span class="side">LEFT</span>Total knee replacement</span>
        </div>
        <div class="band-allergy is-allergy">
          <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
          <span><strong>Allergy: penicillin</strong><span>Anaphylaxis</span></span>
        </div>
      </div>
      <div class="band">
        <div class="band-id">
          <span class="band-name">Meera Iyer</span>
          <dl class="band-facts">
            <div><dt>Age</dt><dd>58</dd></div>
            <div><dt>Sex</dt><dd>Female</dd></div>
            <div><dt>Demo ID</dt><dd class="data">1002</dd></div>
          </dl>
          <span class="band-proc"><span class="side">RIGHT</span>Total hip replacement</span>
        </div>
        <div class="band-allergy is-none">
          <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
          <span><strong>No known allergies</strong><span>Checked at admission</span></span>
        </div>
      </div>
      <div class="band">
        <div class="band-id">
          <span class="band-name">Arjun Rao</span>
          <dl class="band-facts">
            <div><dt>Age</dt><dd>41</dd></div>
            <div><dt>Sex</dt><dd>Male</dd></div>
            <div><dt>Demo ID</dt><dd class="data">1003</dd></div>
          </dl>
          <span class="band-proc">Keyhole gallbladder removal</span>
        </div>
        <div class="band-allergy is-unknown">
          <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
          <span><strong>Allergies not recorded</strong><span>Ask before giving drugs</span></span>
        </div>
      </div>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-colour">
    <h2 id="sg-colour">Colour means something</h2>
    <p class="sg-note">Patient monitors show high-priority alarms in red, medium in yellow and low in cyan (the IEC 60601-1-8 alarm standard). Our screens follow the same rule, so a colour means the same thing on the wall as on the monitor. Teal, the colour of surgical drapes, marks the main action and anything confirmed.</p>
    <ul class="swatches">
      <li class="swatch"><i style="background: var(--alarm)"></i><div><b>Red: high priority</b><span>Allergy, blocked case, drug clash</span></div></li>
      <li class="swatch"><i style="background: var(--caution)"></i><div><b>Amber: medium priority</b><span>Suggested entry, timer reminder</span></div></li>
      <li class="swatch"><i style="background: var(--advisory)"></i><div><b>Cyan: advisory</b><span>Reminders and information</span></div></li>
      <li class="swatch"><i style="background: var(--action)"></i><div><b>Teal: confirmed</b><span>Main action, confirmed entry, ready case</span></div></li>
      <li class="swatch"><i style="background: var(--ink)"></i><div><b>Ink</b><span>Text and the operating side</span></div></li>
      <li class="swatch"><i style="background: var(--paper)"></i><div><b>Paper</b><span>Page background</span></div></li>
    </ul>
  </section>

  <section class="sg" aria-labelledby="sg-type">
    <h2 id="sg-type">Type</h2>
    <p class="sg-note">Atkinson Hyperlegible was designed so characters that look alike are easy to tell apart. In drug doses and patient details, a misread 1 or 0 can cause harm.</p>
    <p class="glyphs" aria-label="Look-alike characters: one, lower-case L, capital I, zero, capital O">1 l I 0 O</p>
    <div class="type-list">
      <div class="type-row"><span>Theatre display timer</span><span class="t-wall">38<small>min</small></span></div>
      <div class="type-row"><span>Screen title</span><span class="t-title">Case prep</span></div>
      <div class="type-row"><span>Section heading</span><span class="t-head">Surgical plan</span></div>
      <div class="type-row"><span>Body text</span><span>Femoral component size 5, tibial component size 4, insert 10 mm.</span></div>
      <div class="type-row"><span>Small text</span><span class="t-small">Ticked by the circulating nurse at 09:12</span></div>
      <div class="type-row"><span>Times and doses</span><span class="data">09:40&nbsp;&nbsp;Vancomycin 1 g IV</span></div>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-words">
    <h2 id="sg-words">How we write clinical details</h2>
    <ul class="rules">
      <li><b>24-hour times.</b> 09:40, not 9:40 am.</li>
      <li><b>Doses with a space before the unit and no trailing zero.</b> 1 g and 0.5 mg, never 1.0 g or .5 mg.</li>
      <li><b>The operating side in full capitals.</b> LEFT or RIGHT, never L or R.</li>
      <li><b>Every AI answer shows its source.</b> If something isn't recorded, the answer says "Not in the record".</li>
      <li><b>Fictional patients only.</b> Every name and ID on these screens is made up.</li>
    </ul>
  </section>

  <section class="sg" aria-labelledby="sg-buttons">
    <h2 id="sg-buttons">Buttons</h2>
    <p class="sg-note">Each button says what it does. Teal marks the main action in an area. On the nurse's phone, buttons are 56 pixels tall so they are easy to hit with gloves on.</p>
    <div class="row">
      <button class="btn btn-primary" type="button" data-sample="Confirm"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirm</button>
      <button class="btn" type="button" data-sample="Edit"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</button>
      <button class="btn" type="button" data-sample="Reject"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>Reject</button>
      <button class="btn btn-quiet" type="button" data-sample="Cancel">Cancel</button>
    </div>
    <div class="row">
      <button class="btn btn-primary btn-lg" type="button" data-sample="Confirm"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirm</button>
      <button class="btn btn-lg" type="button" data-sample="Edit"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</button>
      <button class="btn btn-lg" type="button" data-sample="Reject"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>Reject</button>
    </div>
    <div class="row">
      <button class="btn btn-primary" type="button" disabled>Confirm</button>
      <button class="btn" type="button" aria-busy="true" aria-disabled="true"><span class="spinner" aria-hidden="true"></span>Asking Claude…</button>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-chips">
    <h2 id="sg-chips">Status labels</h2>
    <p class="sg-note">Each label has an icon and a word, so colour is never the only signal.</p>
    <div class="row">
      <span class="chip chip-ok"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Ready</span>
      <span class="chip chip-alarm"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>Blocked</span>
      <span class="chip chip-caution"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Suggested</span>
      <span class="chip chip-ok"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirmed</span>
      <span class="chip chip-muted"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>Rejected</span>
      <span class="chip chip-caution"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>Not recorded</span>
    </div>
    <div class="row">
      <span class="chip"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>Heard</span>
      <span class="chip"><svg class="icon" aria-hidden="true"><use href="#i-scan"/></svg>Scanned</span>
      <span class="chip"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg>Typed</span>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-alerts">
    <h2 id="sg-alerts">Alerts</h2>
    <p class="sg-note">Alerts stay on screen until someone deals with them. They never pop up over the work.</p>
    <div class="stack">
      <div class="alert alert-high">
        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <div class="alert-text"><b>Allergy clash</b><span>Cefazolin is in the plan. This patient has a penicillin allergy with anaphylaxis. Review possible cross-reaction.</span></div>
        <button class="btn" type="button" data-sample="Review plan">Review plan</button>
      </div>
      <div class="alert alert-medium">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
        <div class="alert-text"><b>Tourniquet on for 60 minutes</b><span>On since 10:21. Next reminder at 90 minutes.</span></div>
        <button class="btn" type="button" data-sample="Acknowledge">Acknowledge</button>
      </div>
      <div class="alert alert-advisory">
        <svg class="icon" aria-hidden="true"><use href="#i-info"/></svg>
        <div class="alert-text"><b>Count before closing</b><span>Swab and instrument count is due before the wound is closed.</span></div>
        <button class="btn" type="button" data-sample="Start count">Start count</button>
      </div>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-record">
    <h2 id="sg-record">Live record</h2>
    <p class="sg-note">What the assistant hears becomes a suggested entry. Nothing joins the record until a person confirms it. Try the buttons on the last entry; this sample resets when you leave the page.</p>
    <ol class="events">
      <li class="event">
        <time class="data" datetime="09:40">09:40</time>
        <div class="event-what"><b>Vancomycin 1 g IV</b><small>Heard, confirmed by the circulating nurse</small></div>
        <span class="chip chip-ok"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirmed</span>
      </li>
      <li class="event">
        <time class="data" datetime="10:21">10:21</time>
        <div class="event-what"><b>Tourniquet on, 250 mmHg</b><small>Heard, confirmed by the circulating nurse</small></div>
        <span class="chip chip-ok"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirmed</span>
      </li>
      <li class="event" data-demo-event>
        <time class="data" datetime="10:58">10:58</time>
        <div class="event-what"><b>Femoral component size 5 opened</b><small>Heard: “open the size five femoral”</small></div>
        <span class="chip chip-caution" data-demo-status><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Suggested</span>
        <div class="event-actions" data-demo-actions>
          <button class="btn btn-primary" type="button" data-act="confirm"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Confirm</button>
          <button class="btn" type="button" data-act="edit"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</button>
          <button class="btn" type="button" data-act="reject"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>Reject</button>
        </div>
        <div class="event-actions" data-demo-undo hidden>
          <button class="btn btn-quiet" type="button" data-act="undo"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>Undo</button>
        </div>
      </li>
    </ol>
  </section>

  <section class="sg" aria-labelledby="sg-checks">
    <h2 id="sg-checks">Checklist</h2>
    <p class="sg-note">Each tick records who ticked it and when. The whole row can be tapped.</p>
    <div class="checks">
      <label class="check"><input type="checkbox" id="sg-c1" checked data-who="the circulating nurse at 09:12"><span>Patient identity confirmed<small>Ticked by the circulating nurse at 09:12</small></span></label>
      <label class="check"><input type="checkbox" id="sg-c2" checked data-who="the surgeon at 09:14"><span>Site marked: LEFT knee<small>Ticked by the surgeon at 09:14</small></span></label>
      <label class="check"><input type="checkbox" id="sg-c3"><span>Anaesthesia safety check complete<small>Not ticked</small></span></label>
      <label class="check"><input type="checkbox" id="sg-c4"><span>Known allergy discussed with the team<small>Not ticked</small></span></label>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-fields">
    <h2 id="sg-fields">Fields</h2>
    <div class="fields">
      <div class="field">
        <label for="sg-size">Femoral component size</label>
        <input id="sg-size" type="text" inputmode="numeric" value="5" aria-describedby="sg-size-help">
        <span class="help" id="sg-size-help">From the surgical plan</span>
      </div>
      <div class="field">
        <label for="sg-drug">Preventive antibiotic</label>
        <select id="sg-drug" aria-describedby="sg-drug-help">
          <option>Vancomycin 1 g IV</option>
          <option>Cefazolin 2 g IV</option>
          <option>Clindamycin 600 mg IV</option>
        </select>
        <span class="help" id="sg-drug-help">Checked against the patient's allergies</span>
      </div>
    </div>
  </section>

  <section class="sg" aria-labelledby="sg-theatre">
    <h2 id="sg-theatre">Theatre display style</h2>
    <p class="sg-note">The wall screen is always dark, like the monitors beside it, with numbers big enough to read from 3 metres. A timer turns amber at its first reminder.</p>
    <div class="theatre theatre-sample">
      <div class="band">
        <div class="band-id">
          <span class="band-name">Ravi Kumar</span>
          <dl class="band-facts">
            <div><dt>Age</dt><dd>64</dd></div>
            <div><dt>Blood</dt><dd>B+, 2 units ready</dd></div>
          </dl>
          <span class="band-proc"><span class="side">LEFT</span>Total knee replacement</span>
        </div>
        <div class="band-allergy is-allergy">
          <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>
          <span><strong>Allergy: penicillin</strong><span>Anaphylaxis</span></span>
        </div>
      </div>
      <div class="tiles">
        <div class="tile">
          <span class="tile-label">Tourniquet</span>
          <span class="tile-value">38<small>min</small></span>
          <span class="tile-sub">On since 10:21</span>
          <div class="meter" role="img" aria-label="38 of 120 minutes, reminders at 60 and 90"><i style="width: 31.7%"></i><b style="left: 50%"></b><b style="left: 75%"></b></div>
          <div class="meter-scale" aria-hidden="true"><span style="left: 0">0</span><span style="left: 50%">60</span><span style="left: 75%">90</span><span>120</span></div>
        </div>
        <div class="tile is-caution">
          <span class="tile-label">Tourniquet</span>
          <span class="tile-value">62<small>min</small></span>
          <span class="tile-sub">Past the 60-minute reminder</span>
          <div class="meter" role="img" aria-label="62 of 120 minutes, reminders at 60 and 90"><i style="width: 51.7%"></i><b style="left: 50%"></b><b style="left: 75%"></b></div>
          <div class="meter-scale" aria-hidden="true"><span style="left: 0">0</span><span style="left: 50%">60</span><span style="left: 75%">90</span><span>120</span></div>
        </div>
        <div class="tile">
          <span class="tile-label">Since incision</span>
          <span class="tile-value">31<small>min</small></span>
          <span class="tile-sub">Incision at 10:28</span>
        </div>
        <div class="tile">
          <span class="tile-label">Anaesthesia</span>
          <span class="tile-value">52<small>min</small></span>
          <span class="tile-sub">Started at 10:07</span>
        </div>
      </div>
      <div class="answer">
        <q>Which implant size did we plan?</q>
        <p class="answer-text">Femoral 5, tibial 4, insert 10 mm</p>
        <p class="answer-source">Source: surgical plan</p>
      </div>
      <div class="listening">
        <span class="dot" aria-hidden="true"></span>
        <b>Listening</b>
        <q>okay, open the size five femoral</q>
      </div>
    </div>
  </section>
</template>
